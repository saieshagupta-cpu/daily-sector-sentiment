name: Daily refresh

# Runs the full sentiment + strength pipeline once a day in the cloud,
# commits the updated SQLite DB back to main, and triggers a Streamlit
# Cloud auto-redeploy.

on:
  schedule:
    # 14:00 UTC daily = 09:00 EST (10:00 EDT in summer).
    # GitHub cron is best-effort and silently skips runs during high load.
    # We schedule a 1-hour retry; the commit step is idempotent (skips if the
    # DB content is unchanged), so the retry is a no-op when the first succeeds.
    - cron: '0 14 * * *'   # primary  — 09:00 EST
    - cron: '0 15 * * *'   # retry    — 10:00 EST
  workflow_dispatch:        # let you trigger manually from the Actions tab

permissions:
  contents: write           # needed to commit + push the updated DB

# Don't pile up runs if a refresh is still going.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # full refresh is ~15 min; 45 is a generous ceiling

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need a real (non-shallow) clone so we can push back
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Cache HuggingFace FinBERT (~450MB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Bump this key if you ever change the sentiment model
          key: hf-finbert-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily refresh
        env:
          FINNHUB_API_KEY:   ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          # Polite UA for Reddit + general requests
          PYTHONUNBUFFERED: '1'
        run: python -u -m jobs.daily_refresh

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f store/amaltash.db extract/us_universe.json
          if git diff --staged --quiet; then
            echo "Nothing changed in tracked artefacts — skipping commit."
            exit 0
          fi
          git commit -m "chore: daily refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Push with retry — if main moved while we were running, rebase + retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected; rebasing onto origin/main..."
            git pull --rebase --strategy-option=ours origin main || true
            sleep $((attempt * 5))
          done
          echo "All push attempts failed."
          exit 1

      - name: Upload logs as artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-logs-${{ github.run_id }}
          path: |
            amaltash_sentiment/jobs/refresh.log
            amaltash_sentiment/jobs/refresh.err
          if-no-files-found: ignore
          retention-days: 14
